[project]
name = "imaginarium"
version = "3.2.0"
description = "Bounded autonomous multi-agent business scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0"]

[tool.setuptools]
package-dir = {"imaginarium" = "."}
packages = ["imaginarium", "imaginarium.agents"]
